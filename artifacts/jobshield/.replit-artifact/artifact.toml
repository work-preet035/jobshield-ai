kind = "web"
previewPath = "/"
title = "JobShield AI"
version = "1.0.0"
id = "artifacts/jobshield"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23190

[services.development]
run = "pnpm --filter @workspace/jobshield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jobshield", "run", "build" ]
publicDir = "artifacts/jobshield/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23190"
BASE_PATH = "/"
